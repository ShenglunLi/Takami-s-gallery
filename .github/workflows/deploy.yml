# 檔案路徑：.github/workflows/deploy.yml

name: GitHub Pages 部署自動化

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  upload:
    name: 準備並上傳網頁成品
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Pages 環境
        uses: actions/configure-pages@v4

      - name: 設定本次成品名稱
        id: artifact-name
        shell: bash
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: 上傳網頁成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: ${{ steps.artifact-name.outputs.name }}

  # 分開 job，避免上傳完成後立即查詢成品時，遇到成品清單尚未更新。
  # 名稱由 upload 傳入；只重跑 deploy 時仍能使用原先上傳的成品。
  deploy:
    name: 部署 GitHub Pages
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: 執行部署
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.upload.outputs.artifact_name }}
